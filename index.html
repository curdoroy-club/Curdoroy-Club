<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curdoroy Club</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d12;
      color: #f2efe6;
      font-family: Georgia, serif;
      text-align: center;
    }
    main {
      padding: 2.5rem;
      max-width: 32rem;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: .1em;
      margin: 0 0 1.2rem;
    }
    p {
      line-height: 1.7;
      margin: .8rem 0;
    }
    .secret {
      opacity: .7;
      font-size: .9rem;
      margin-top: 2.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Curdoroy Club 139a</h1>
    <p>Du hast einen verborgenen Zugang gefunden.</p>
    <p>Du bist eingeladen, Teil einer kleinen, stilvollen Gesellschaft zu werden.</p>
    <p>Keine Anmeldung oder Erklärung. Nur Cord. Jeden Donnerstag.</p>
    <p class="secret">Der Club kennt seine Mitglieder nicht. Sie erkennen sich am Cord.</p>
  </main>
</body>
</html>
